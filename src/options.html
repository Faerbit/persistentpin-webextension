<!DOCTYPE html>
<html lang="">
    <meta charset="utf-8"/>
    <head>
        <link rel="stylesheet" href="options.css" type="text/css">
        <link rel="stylesheet" href="../font-awesome-4.7.0/css/font-awesome.min.css" type="text/css">
    </head>
    <body>
        <div class="btns">
            <button class="large" id="btn-grab">
                <i class="fa fa-hand-rock-o"></i>
                <span data-i18n="grabButton"></span>
            </button>
        </div>
        <table>
            <thead>
            <tr><th data-i18n="websitesTableHeader"></th></tr>
            </thead>
            <tbody id="tbl-websites">
                <tr><td class="empty">Empty</td></tr>
            </tbody>
        </table>
        <div class="btns">
            <button id="btn-add">
                <i class="fa fa-plus"></i>
                <span data-i18n="addButton"></span>
            </button>
            <button id="btn-edit">
                <i class="fa fa-pencil"></i>
                <span data-i18n="editButton"></span>
            </button>
            <button id="btn-up">
                <i class="fa fa-arrow-up"></i>
                <span data-i18n="upButton"></span>
            </button>
            <button id="btn-down">
                <i class="fa fa-arrow-down"></i>
                <span data-i18n="downButton"></span>
            </button>
            <button id="btn-delete">
                <i class="fa fa-trash-o"></i>
                <span data-i18n="deleteButton"></span>
            </button>
        </div>
        <div class="btns">
              <span class="switch-label" id="grabContextMenuSliderLabel" data-i18n="grabContextMenuSlider"></span>
              <label class="switch">
                  <input type="checkbox" id="grabContextMenuSlider">
                  <span class="slider"></span>
              </label>
        </div>
        <div class="btns">
            <span class="switch-label" id="reopenContextMenuSliderLabel" data-i18n="reopenContextMenuSlider"></span>
            <label class="switch">
                <input type="checkbox" id="reopenContextMenuSlider">
                <span class="slider"></span>
            </label>
        </div>
        <div class="btns">
            <span class="switch-label" id="resetContextMenuSliderLabel" data-i18n="resetContextMenuSlider"></span>
            <label class="switch">
                <input type="checkbox" id="resetContextMenuSlider">
                <span class="slider"></span>
            </label>
        </div>
        <div class="btns">
              <span class="switch-label" id="pinInAllWindowsSliderLabel" data-i18n="pinInAllWindowsSlider"></span>
              <label class="switch">
                  <input type="checkbox" id="pinInAllWindowsSlider">
                  <span class="slider"></span>
              </label>
        </div>
        <div class="btns">
              <span class="switch-label" id="syncSliderLabel" data-i18n="syncSlider"></span>
              <label class="switch">
                  <input type="checkbox" id="syncSlider">
                  <span class="slider"></span>
              </label>
        </div>
        <script type="module" src="options.js"></script>
    </body>
</html>
